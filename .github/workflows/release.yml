name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify version metadata
        run: |
          grep -F "Travel OS ${GITHUB_REF_NAME}" RELEASE_NOTES.md
          grep -F "/tag/${GITHUB_REF_NAME}" README.md
      - name: Run contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run portable view interaction logic tests
        run: node --test tests/test_trip_view.cjs
      - name: Build deterministic packages
        run: |
          source_archive="Travel-OS-${GITHUB_REF_NAME}.zip"
          skill_archive="Travel-OS-Skill-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --output="$source_archive" "$GITHUB_SHA"
          git archive --format=zip --output="$skill_archive" "$GITHUB_SHA:skill/travel-os"
          unzip -p "$skill_archive" SKILL.md | grep -F "name: travel-os"
          sha256sum "$source_archive" "$skill_archive" > "Travel-OS-${GITHUB_REF_NAME}.sha256"
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Travel-OS-${GITHUB_REF_NAME}.zip" \
            "Travel-OS-Skill-${GITHUB_REF_NAME}.zip" \
            "Travel-OS-${GITHUB_REF_NAME}.sha256" \
            --title "Travel OS ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
